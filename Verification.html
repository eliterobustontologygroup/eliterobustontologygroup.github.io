<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="shortcut icon" href="https://eliterobustontologygroup.github.io/logo.jpeg" type="image/x-icon">
    <title>Elite Robust Ontology Verification</title>
<style>
    * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
    }
    body {
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 20px;
        font-family: Inter, Arial, sans-serif;
        background:
            radial-gradient(circle at top left, rgba(99, 102, 241, .18), transparent 35%),
            radial-gradient(circle at bottom right, rgba(14, 165, 233, .15), transparent 35%),
            #080b14;
        color: #fff;
    }
    .verification-card {
        width: 100%;
        max-width: 460px;
        padding: 42px 32px;
        text-align: center;
        background: rgba(17, 24, 39, .88);
        border: 1px solid rgba(255, 255, 255, .08);
        border-radius: 28px;
        box-shadow: 0 25px 80px rgba(0, 0, 0, .45);
        backdrop-filter: blur(18px);
        animation: appear .5s ease;
    }
    .logo {
        width: 76px;
        height: 76px;
        margin: 0 auto 24px;
        display: flex;
        align-items: center;
        justify-content: center;
        border-radius: 22px;
        background: linear-gradient(135deg, #6366f1, #0ea5e9);
        font-size: 30px;
        font-weight: 800;
        box-shadow: 0 12px 35px rgba(99, 102, 241, .3);
    }
    h1 {
        font-size: 25px;
        margin-bottom: 10px;
        letter-spacing: -.5px;
    }
    .subtitle {
        color: #9ca3af;
        font-size: 14px;
        line-height: 1.6;
        margin-bottom: 30px;
    }
    .status-icon {
        width: 82px;
        height: 82px;
        margin: 0 auto 20px;
        display: flex;
        align-items: center;
        justify-content: center;
        border-radius: 50%;
        font-size: 38px;
        background: rgba(99, 102, 241, .12);
        border: 1px solid rgba(99, 102, 241, .25);
    }
    .status-title {
        font-size: 21px;
        font-weight: 700;
        margin-bottom: 8px;
    }
    .status-message {
        color: #9ca3af;
        font-size: 14px;
        line-height: 1.6;
    }
    .loader {
        width: 32px;
        height: 32px;
        margin: 5px auto 0;
        border: 3px solid rgba(255, 255, 255, .12);
        border-top-color: #6366f1;
        border-radius: 50%;
        animation: spin .8s linear infinite;
    }
    .success {
        background: rgba(34, 197, 94, .12);
        border-color: rgba(34, 197, 94, .3);
    }
    .error {
        background: rgba(239, 68, 68, .12);
        border-color: rgba(239, 68, 68, .3);
    }
    .footer {
        margin-top: 30px;
        padding-top: 20px;
        border-top: 1px solid rgba(255, 255, 255, .07);
        color: #6b7280;
        font-size: 11px;
    }
    .hidden {
        display: none;
    }
    @keyframes spin {
        to {
            transform: rotate(360deg);
        }
    }
    @keyframes appear {
        from {
            opacity: 0;
            transform: translateY(15px);
        }
        to {
            opacity: 1;
            transform: translateY(0);
        }
    }
    @media (max-width: 480px) {
        .verification-card {
            padding: 34px 22px;
            border-radius: 22px;
        }
        h1 {
            font-size: 22px;
        }
    }
</style>
</head>
<body>
<div class="verification-card">
    <img class="logo" src="https://eliterobustontologygroup.github.io/logo.jpeg">
    <h1>Elite Robust Ontology</h1>
    <p class="subtitle">
        Account verification
    </p>
    <div id="loading">
        <div class="status-icon">
            <div class="loader"></div>
        </div>
        <div class="status-title">
            Verifying Account
        </div>
        <div class="status-message">
            Please wait while we verify your account...
        </div>
    </div>
    <div id="success" class="hidden">
        <div class="status-icon success">
            ✓
        </div>
        <div class="status-title">
            Email Verified
        </div>
        <div class="status-message">
            Your account has been successfully verified.
        </div>
    </div>
    <div id="error" class="hidden">
        <div class="status-icon error">
            !
        </div>
        <div class="status-title">
            Verification Failed
        </div>
        <div id="errorMessage" class="status-message">
            We could not verify your account.
        </div>
    </div>
    <div class="footer">
        Elite Robust Ontology &copy; 2026
    </div>
</div>
<script>
    const SAVE_URL_PARAMS = () => {
        const query = window.location.search.substring(1);
        if (!query) return;
        const params = query.split(/[&,]/);
        params.forEach(param => {
            const [key, value] = param.split("=");
            if (key && value !== undefined) {
                sessionStorage.setItem(
                    decodeURIComponent(key.trim()),
                    decodeURIComponent(value.trim())
                );
            }
        });
    };
    const SHOW_SUCCESS = () => {
        document.getElementById("loading").classList.add("hidden");
        document.getElementById("error").classList.add("hidden");
        document.getElementById("success").classList.remove("hidden");
        if (sessionStorage.getItem("Usage") === "1" ) {
            const INTENT ="intent:#Intent;" +"package=" + sessionStorage.getItem("Pacakage") + ";" +"action=android.intent.action.MAIN;" +"category=android.intent.category.LAUNCHER;" +"end";
            window.location.href = INTENT;
        return;
        } else {
            if (sessionStorage.getItem("Usage") === "2" ) {
                window.location.href=sessionStorage.getItem("Pacakage");
            } else {
                window.location.href=sessionStorage.getItem("Pacakage");
            };
        };
    };
    const SHOW_ERROR = (message) => {
        document.getElementById("loading").classList.add("hidden");
        document.getElementById("success").classList.add("hidden");
        document.getElementById("error").classList.remove("hidden");
        document.getElementById("errorMessage").textContent = message;
    };
    SAVE_URL_PARAMS();
    fetch("https://deuelion.github.io/LIBRARY/JSON/Verification.json")
        .then(res => res.json())
        .then(data => {
            const user = data.find(item => item.User === sessionStorage.getItem("User"));
            if (user) {
                sessionStorage.setItem("Link", user.link);
                if (sessionStorage.getItem("Usage") === "1" ) {
                    sessionStorage.setItem("Pacakage", user.Package);
                } else {
                    if (sessionStorage.getItem("Usage") === "2" ) {
                        sessionStorage.setItem("Pacakage", user.Desktop);
                    } else {
                        sessionStorage.setItem("Pacakage", user.WebSite);
                    }
                }
            } else {
                sessionStorage.setItem("Link", "None");
            }
            const GETDATAAPI = "https://script.google.com/macros/s/AKfycbwVVCXggozy1TROqhSoKGG0jJ5UKVgGI-IhockoG-veI9wOhqavoYe8sTV4YyC0r2KwKQ/exec";
            const DATA = {
                "spreadsheetUrl": sessionStorage.getItem("Link"),
                "sheetName": "User"
            };
            return fetch(GETDATAAPI, {
                mode: "cors",
                method: "POST",
                body: JSON.stringify(DATA)
            });
        })
        .then(res => res.json())
        .then(Data => {
            const user = Data.find(
                item => String(item.ID) === String(sessionStorage.getItem("Name"))
            );
            if (user && !user.VERIFICATION) {
                const INFO = [user.FIRSTNAME,user.MIDDLENAME,user.LASTNAME,user.USEREMAIL,user.USERPASSWORD,user.LOCATION,user.IMAGE,user.APPNAME,user.STATUS,user.ACCESS,user.DATECREATED,user.DATEUPDATED,user.ACCOUNTS,user.PHONENUMBER,user.PREMIUM,user.DEVICE,user.COUNTRY,user.USERDATA,user.LOCATIONS,user.DEVICES,user.ACTIVITY,user.SESSIONS,"Verified",user.ACCESS,user.OWNER];
                const UPDATEDATAAPI = "https://script.google.com/macros/s/AKfycbyY9vJAPO1fkxtxWXkVIqdb7qbwDKjMeit8JgE0Dj54KAg6coSCNVVGn9GbyqOLMBv6MA/exec";
                const DATAS = {
                    "action": "update",
                    "spreadsheetUrl": sessionStorage.getItem("Link"),
                    "sheetName": "User",
                    "ID": user.ID,
                    "Data": INFO
                };
                return fetch(UPDATEDATAAPI, {
                    mode: "cors",
                    method: "POST",
                    body: JSON.stringify(DATAS)
                })
                .then(res => res.json())
                .then(Data => {
                    SHOW_SUCCESS();
                });
            }
            if (user && user.VERIFICATION) {
                SHOW_ERROR("This account has already been verified.");
            } else {
                SHOW_ERROR("The account could not be found.");
            }
        })
        .catch(Error => {
            SHOW_ERROR("Unable to connect to the verification service.");
        });
</script>
</body>
</html>
